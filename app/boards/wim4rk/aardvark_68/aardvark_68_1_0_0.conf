# SPDX-License-Identifier: MIT
#
# ZMK-application-only options: kept out of the board defconfig because
# that file is shared with MCUboot's sysbuild image, which doesn't have
# ZMK's Kconfig tree. Pass explicitly with -Dapp_EXTRA_CONF_FILE=<this file>.

CONFIG_ZMK_USB=y
# Bluetooth is off for now (USB only). Set to y to re-enable; the BLE
# defaults in Kconfig.defconfig then apply again.
CONFIG_ZMK_BLE=n

# STM32 GPIO only supports edge-triggered interrupts, but ZMK's default
# kscan matrix driver mode wants level-triggered ones - force polling
# instead (same fix used by other STM32 ZMK boards, e.g. blackpill_f401ce).
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# EXPERIMENTAL_SEC implies passkey entry on the keyboard; keep Just Works.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
